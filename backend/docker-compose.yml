services:
  mysql:
    image: mysql:8.0
    container_name: ai_newshub_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ai_newshub
      MYSQL_USER: ai_newshub
      MYSQL_PASSWORD: ai_newshub_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
